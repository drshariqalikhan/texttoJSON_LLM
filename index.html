<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Natural Language to JSON Parser</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f8f9fa;
            color: #212529;
        }
        h2 { color: #0d6efd; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 15px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 6px;
        }
        button:hover { background-color: #0b5ed7; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        .output-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }
        @media (max-width: 768px) {
            .output-container { grid-template-columns: 1fr; }
        }
        .panel {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 15px;
        }
        .panel h3 { margin-top: 0; color: #495057; border-bottom: 2px solid #dee2e6; padding-bottom: 8px;}
        pre {
            background-color: #f1f3f5;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }
        .error { color: #dc3545; font-weight: bold; }
        .status { color: #0d6efd; font-style: italic; }
    </style>
</head>
<body>

    <h2>Structured Text-to-JSON Extractor</h2>
    <p>Using a <strong>completely registration-free, keyless public endpoint</strong>. No popups, no signups.</p>
    
    <label for="textInput"><strong>Enter unstructured text:</strong></label>
    <textarea id="textInput" placeholder="e.g., John Doe is a 34-year-old developer who knows Python, JavaScript, and AWS Cloud tools."></textarea>
    
    <button id="extractBtn" onclick="processExtraction()">Extract Data</button>
    <span id="loadingStatus" class="status" style="margin-left: 15px; display: none;">Calling API and cleaning layout...</span>

    <div class="output-container">
        <div class="panel">
            <h3>Raw Engine Response</h3>
            <pre id="rawOutput">Click 'Extract Data' to execute...</pre>
        </div>
        
        <div class="panel">
            <h3>Regex-Sanitized & Parsed JSON</h3>
            <pre id="parsedOutput">Awaiting processing...</pre>
        </div>
    </div>

    <script>
        // Highly resilient regex cleanser to combat missing token schemas on free open tiers
        function cleanAndParseJSON(rawString) {
            // 1. Strip away markdown formatting identifiers (```json ... ``` or ``` ... ```)
            let sanitized = rawString.replace(/```(?:json)?\s*([\s\(\S\)]*?)\s*```/gi, '$1');
            
            // 2. Find boundary indicators of the absolute outer object wrapper
            const firstBracket = sanitized.indexOf('{');
            const lastBracket = sanitized.lastIndexOf('}');
            
            if (firstBracket === -1 || lastBracket === -1) {
                throw new Error("Could not find valid JSON structural brackets inside the engine response.");
            }
            
            sanitized = sanitized.substring(firstBracket, lastBracket + 1);
            
            // 3. Evaluate into a runtime JavaScript Object
            return JSON.parse(sanitized);
        }

        async function processExtraction() {
            const inputData = document.getElementById('textInput').value.trim();
            const extractBtn = document.getElementById('extractBtn');
            const loadingStatus = document.getElementById('loadingStatus');
            const rawOutput = document.getElementById('rawOutput');
            const parsedOutput = document.getElementById('parsedOutput');

            if (!inputData) {
                alert("Please provide some text data to extract.");
                return;
            }

            // UI Feedback state
            extractBtn.disabled = true;
            loadingStatus.style.display = "inline";
            rawOutput.textContent = "Fetching...";
            parsedOutput.textContent = "Fetching...";

            const targetSchema = {
                name: "string",
                age: "integer",
                skills: "array of strings"
            };

            const promptInstructions = `
                You are a system data parser. Extract entities from the user input into a strict JSON payload matching this target layout:
                ${JSON.stringify(targetSchema)}

                Return ONLY the valid JSON structure. Do not include any pleasantries or conversational intros.
                User input data: "${inputData}"
            `;

            try {
                // Hitting the registration-free public auto-routing gateway
                const response = await fetch("https://kilo.ai", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                        // Note: Absolutely zero authorization bearer token required
                    },
                    body: JSON.stringify({
                        model: "kilo-auto/free", // Automatically hooks into an available open-source model
                        messages: [{ role: "user", content: promptInstructions }],
                        temperature: 0.0
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned error status code: ${response.status}`);
                }

                const payload = await response.json();
                const rawModelString = payload.choices[0].message.content;
                
                // Render raw model string output
                rawOutput.textContent = rawModelString;

                // Run regex parsing cleansing logic
                const cleanedJsonObj = cleanAndParseJSON(rawModelString);
                
                // Render the finalized pure JSON output object safely
                parsedOutput.innerHTML = `<span style="color: #198754;">✓ Success! Parsed Object:</span>\n${JSON.stringify(cleanedJsonObj, null, 4)}`;

            } catch (err) {
                console.error(err);
                rawOutput.textContent = "Error occurred.";
                parsedOutput.innerHTML = `<span class="error">Extraction parsing failed:</span>\n${err.message}`;
            } finally {
                extractBtn.disabled = false;
                loadingStatus.style.display = "none";
            }
        }
    </script>
</body>
</html>
